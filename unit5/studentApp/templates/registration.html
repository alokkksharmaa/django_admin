<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student registration</title>
</head>

<body>
  <main>
    <h1>Add a student</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Save student</button>
    </form>
    <p><a href="{% url 'home' %}">Home</a></p>
  </main>
</body>

</html>
