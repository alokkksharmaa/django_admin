<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
  }

  form {
    border: 1px solid #cfd8dc;
    width: min(100%, 480px);
    padding: 16px;
    border-radius: 8px;
    background: #ffffff;
  }

  input {
    width: 100%;
    height: 30px;
    margin: 6px 0 12px;
    padding: 6px 8px;
    border: 1px solid #b0bec5;
    border-radius: 4px;
  }

  button {
    width: 100%;
    height: 34px;
    border: 0;
    border-radius: 4px;
    background: #1976d2;
    color: #ffffff;
    cursor: pointer;
  }
</style>

<body>
  <form method="POST">
    <h1>Inquiry form</h1>
    {% csrf_token %}
    <label>Name:</label>
    <input type="text" name="name"></input>
    <label>Email:</label>
    <input type="email" name="email">
    <label>Phone:</label>
    <input type="number" name="phone">
    <label>Message:</label>
    <input type="text" name="message">
    <button type="submit">Submit</button>
  </form>
  {% if name %}
  {{name}}
  {{email}}
  {{phone}}
  {{message}}
  {% endif %}
</body>

</html>
